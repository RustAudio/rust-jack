name: test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Install dependencies
        run: sudo apt update && sudo apt install jackd2 libjack-jackd2-0 libjack-jackd2-dev
      # This is required for the tests, but we start it earlier since it may
      # take a while to initialize.
      - name: Start dummy JACK server
        run: jackd -r -ddummy -r44100 -p1024 &
      - name: Install Cargo Nextest
        uses: taiki-e/install-action@nextest
      - name: Build (Default Features)
        run: cargo build --verbose 
      - name: Build (No Features)
        run: cargo build --verbose --no-default-features
      - name: Build (All Features)
        run: cargo build --verbose --all-features
      - name: Build (examples)
        run: cargo build --verbose --examples --all-features
      - name: Run Tests (Default Features)
        run: cargo nextest run --run-ignored all
      - name: Run Doc Tests
        run: cargo doc && cargo test --doc
  msrv:
    # Keep the toolchain version in sync with `rust-version` in Cargo.toml and
    # jack-sys/Cargo.toml.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Install dependencies
        run: sudo apt update && sudo apt install libjack-jackd2-dev
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85
      - name: Check jack (Default Features)
        run: cargo check --verbose
      - name: Check jack (No Features)
        run: cargo check --verbose --no-default-features
      - name: Check jack (All Features)
        run: cargo check --verbose --all-features
      - name: Check jack-sys (No Features)
        run: cargo check --verbose
        working-directory: jack-sys
      - name: Check jack-sys (dynamic_loading)
        run: cargo check --verbose --features dynamic_loading
        working-directory: jack-sys
